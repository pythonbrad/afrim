[package]
name = "afrim"
version = "0.7.0"
edition = "2021"
description = "Core library of the afrim input method."
keywords = ["ime", "keyboard"]
categories = ["accessibility"]
readme = "../README.md"
repository.workspace = true
license.workspace = true
authors.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
doc = true
name = "afrim"
path = "./src/main.rs"

[features]
default = ["rhai", "strsim"]
rhai = ["afrim-config/rhai", "afrim-translator/rhai"]
strsim = ["afrim-translator/strsim"]
serde = ["dep:serde", "afrim-translator/serde"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
enigo = "0.6.1"
afrim-config = { version = "0.4.8", path = "../config", default-features = false }
afrim-preprocessor = { version = "0.7.0", path = "../engine/preprocessor", default-features = false }
afrim-translator = { version = "0.2.4", path = "../engine/translator", default-features = false }
rdev = "0.5.3"
# rdev = "6.0.0"
anyhow = "1.0.103"
serde = { version = "1.0.228", optional = true }

# [target.'cfg(all(target_family = "unix", not(target_os = "macos")))'.dependencies]
# rdev = { version = "6.0.0", features = ["x11"] }

[dev-dependencies]
afrish = "0.1.1"
